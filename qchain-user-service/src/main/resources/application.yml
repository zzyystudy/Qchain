server:
  port: 8061
spring:
  application:
    name: user-service #微服务名称
  profiles:
    active: dev
  data:
    redis:
      host: 192.168.249.186
      port: 6378
      password:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/qchain-user?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  cloud:
    openfeign:
      okhttp:
        enabled: true
      httpclient:
        hc5:
          enabled: false
        connection-timeout: 3000
        # 当前 OpenFeign 版本将此值用于 OkHttp 连接池的最大空闲连接数。
        max-connections: 50
        max-connections-per-route: 50
        time-to-live: 300
        time-to-live-unit: SECONDS
        ok-http:
          read-timeout: 10s
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000
    nacos:
      server-addr: 192.168.249.189:8848
mybatis-plus:
  type-aliases-package: com.zxyy.user.domain.entity # 别名扫描包
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
# knife4j配置
knife4j:
  enable: true
# springdoc-openapi项目配置
springdoc:
  # 禁用扫描@ControllerAdvice的泛型响应，避免Spring Framework 6.2.x的ControllerAdviceBean构造器不兼容
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zxyy.user.controller
# JWT 签名配置，沿用 ShopStore 的密钥、有效期和请求头名称。
shop:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: Wmhhb1poaVl1RGVZdW5QYW5YaWFuZ011VG9rZW4=
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: authentication

# 两个服务使用相同的内部调用令牌，不依赖浏览器或管理端登录状态。
qchain:
  internal:
    token: ${QCHAIN_INTERNAL_TOKEN:}
