server:
  port: 8061
spring:
  config:
    import:
      - optional:file:../config/security-local.yml
      - optional:file:./config/security-local.yml
shop:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${QCHAIN_JWT_SECRET:Wmhhb1poaVl1RGVZdW5QYW5YaWFuZ011VG9rZW4=}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: authentication

# 两个服务使用相同的内部调用令牌，不依赖浏览器或管理端登录状态。
qchain:
  security:
    gateway-token: ${QCHAIN_GATEWAY_TOKEN:}
  internal:
    token: ${QCHAIN_INTERNAL_TOKEN:}
