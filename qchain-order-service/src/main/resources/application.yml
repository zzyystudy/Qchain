server:
  port: 8062
spring:
  config:
    import:
      - optional:file:../config/security-local.yml
      - optional:file:./config/security-local.yml
      # 兼容 IDEA 使用订单模块目录或 Qchain 根目录作为工作目录。
      - optional:file:../config/order-local.yml
      - optional:file:./config/order-local.yml
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.249.190}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:123456}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          stateless: true
          max-attempts: 3
          initial-interval: 1000ms
          max-interval: 5000ms
          multiplier: 2
  mail:
    username: ${shop.mail.username:}
    password: ${shop.mail.password:}
    host: ${shop.mail.host:localhost}
    port: ${MAIL_PORT:465}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  freemarker:
    suffix: .ftl
    charset: UTF-8

# 两个服务使用相同的内部调用令牌，不依赖浏览器或管理端登录状态。
qchain:
  security:
    gateway-token: ${QCHAIN_GATEWAY_TOKEN:}
  internal:
    token: ${QCHAIN_INTERNAL_TOKEN:}
